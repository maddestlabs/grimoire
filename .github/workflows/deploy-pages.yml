name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'

      - name: Verify Emscripten Environment
        run: emcc -v

      - name: Configure CMake with WebGPU & Size Optimization
        run: |
          emcmake cmake -B build-web -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRIMOIRE_BUILD_TESTS=OFF

      - name: Compile Grimoire WebGPU Wasm Binary
        run: |
          cmake --build build-web --config Release --parallel

      - name: Stage Artifacts for GitHub Pages
        run: |
          mkdir -p dist
          # Provide both index.html and grimoire.html for root navigation
          cp build-web/grimoire.html dist/index.html
          cp build-web/grimoire.html dist/grimoire.html
          cp build-web/grimoire.js dist/grimoire.js
          cp build-web/grimoire.wasm dist/grimoire.wasm
          echo "=== Staged Artifacts Footprint ==="
          ls -lh dist/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
